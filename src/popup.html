<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="dot" aria-hidden="true"></span>
      <h1>双语对照翻译</h1>
    </header>

    <button id="toggle" type="button">翻译此页</button>
    <p id="status">读取中…</p>

    <section class="engine">
      <label class="row">
        <span>翻译引擎</span>
        <select id="provider"></select>
      </label>
      <p id="pnote" class="note"></p>
      <div id="pfields" class="fields"></div>
      <button id="save" type="button" class="secondary">保存并测试</button>
      <pre id="diagout" hidden></pre>
    </section>

    <label class="row">
      <span>目标语言</span>
      <select id="lang">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
      </select>
    </label>

    <label class="row">
      <span>短文本块</span>
      <select id="short">
        <option value="hover">悬停才显示</option>
        <option value="inline">直接显示译文</option>
      </select>
    </label>

    <label class="row">
      <input type="checkbox" id="auto" />
      <span>Google 搜索页自动翻译</span>
    </label>

    <label class="row">
      <input type="checkbox" id="only" />
      <span>只看译文（隐藏原文）</span>
    </label>

    <label class="row">
      <input type="checkbox" id="names" />
      <span>跳过用户名 / 作者名</span>
    </label>

    <footer>工具栏图标或 Alt+T 随时开关</footer>

    <script src="popup.js"></script>
  </body>
</html>
